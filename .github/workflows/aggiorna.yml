name: Aggiorna le schede

on:
  schedule:
    # Ogni giorno alle 05:30 UTC (le 7:30 in Italia d'estate, le 6:30 d'inverno)
    - cron: "30 5 * * *"
  # Permette di avviarlo a mano dalla scheda "Actions" di GitHub
  workflow_dispatch:

concurrency:
  group: aggiorna-schede
  cancel-in-progress: false

jobs:
  aggiorna:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    outputs:
      novita: ${{ steps.salva.outputs.novita }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Installa le dipendenze
        run: npm install --no-audit --no-fund

      - name: Leggi le fonti e crea le schede
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: npm run aggiorna

      - name: Salva i risultati nel repository
        id: salva
        run: |
          git config user.name "lumen-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "Nessuna novità oggi."
            echo "novita=no" >> "$GITHUB_OUTPUT"
          else
            git commit -m "Nuove schede del $(date -u +%Y-%m-%d)"
            git push
            echo "novita=si" >> "$GITHUB_OUTPUT"
          fi

  # Pubblica subito il sito aggiornato su GitHub Pages
  pubblica:
    needs: aggiorna
    if: needs.aggiorna.outputs.novita == 'si'
    uses: ./.github/workflows/pubblica.yml
    permissions:
      contents: read
      pages: write
      id-token: write
