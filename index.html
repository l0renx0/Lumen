<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Lumen · Impara quello che ti incuriosisce</title>
  <meta name="description" content="Scegli una materia e approfondisci gli argomenti che ti incuriosiscono, con spiegazioni semplici, video e manuali universitari gratuiti.">
  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0c0c0d" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Lumen">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="assets/icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Literata:ital,opsz,wght@0,7..72,400..700;1,7..72,400..600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/app.css">
  <script>
    try { const t = (localStorage.getItem('lumen.theme') || '').replace(/"/g, ''); if (t) document.documentElement.dataset.theme = t; } catch (e) {}
  </script>
</head>
<body>
  <header class="top">
    <button class="fresh" id="fresh" hidden><span class="fresh__dot"></span>Nuovi argomenti · <strong>Aggiorna</strong></button>
    <div class="top__row">
      <button class="back icon-btn" id="back" aria-label="Indietro" hidden><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>
      <a class="brand" href="#/" id="brand">
        <svg class="brand__mark" viewBox="0 0 32 32" aria-hidden="true"><circle cx="16" cy="16" r="6.5"/><path d="M16 2.5v5M16 24.5v5M2.5 16h5M24.5 16h5M6.4 6.4l3.5 3.5M22.1 22.1l3.5 3.5M6.4 25.6l3.5-3.5M22.1 9.9l3.5-3.5"/></svg>
        <span class="brand__name">Lumen</span>
      </a>
      <div class="top__actions">
        <button class="streak" id="streakBtn" aria-label="Giorni di fila">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.5c.6 3.2-1.2 4.9-2.7 6.5C7.8 10.6 6.5 12.2 6.5 15a5.5 5.5 0 0 0 11 0c0-2.1-.9-3.6-1.9-4.9-.3 1.5-1.1 2.6-2.4 3 .6-3.9-.4-7.6-1.2-10.6Z"/></svg>
          <span id="streakNum">0</span>
        </button>
        <a class="icon-btn" href="#/salvati" id="savedBtn" aria-label="Salvati"><svg viewBox="0 0 24 24"><path d="M6.5 3.5h11v17l-5.5-4-5.5 4z"/></svg></a>
        <button class="icon-btn" id="themeBtn" aria-label="Tema chiaro o scuro">
          <svg viewBox="0 0 24 24"><path class="i-sun" d="M12 4V2m0 20v-2m8-8h2M2 12h2m13.66-5.66 1.41-1.41M4.93 19.07l1.41-1.41m0-11.32L4.93 4.93m14.14 14.14-1.41-1.41M12 17a5 5 0 1 0 0-10 5 5 0 0 0 0 10Z"/><path class="i-moon" d="M20.5 14.5A8.5 8.5 0 0 1 9.5 3.5a8.5 8.5 0 1 0 11 11Z"/></svg>
        </button>
        <button class="icon-btn" id="nightBtn" aria-label="Filtro luce blu" aria-pressed="false">
          <svg viewBox="0 0 24 24"><path d="M3 18h18M6 14.5a6 6 0 0 1 12 0M12 4.5V6M4.9 7.4 6 8.5M19.1 7.4 18 8.5M8 21.5h8"/></svg>
        </button>
      </div>
    </div>
  </header>

  <main id="view" class="view" tabindex="-1"></main>

  <article class="detail" id="detail" role="dialog" aria-modal="true" aria-labelledby="dTitle" hidden>
    <div class="dbar" id="dBar">
      <button class="icon-btn" id="dClose" aria-label="Chiudi"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>
      <p class="dbar__title" id="dBarTitle"></p>
      <button class="icon-btn" id="dSize" aria-label="Dimensione del testo"><span class="aa">A<small>A</small></span></button>
      <button class="icon-btn" id="dSave" aria-label="Salva" aria-pressed="false"><svg viewBox="0 0 24 24"><path d="M6.5 3.5h11v17l-5.5-4-5.5 4z"/></svg></button>
      <span class="dbar__progress"><span id="dProgress"></span></span>
    </div>
    <div class="detail__scroll" id="dScroll">
      <div class="detail__inner" id="dBody"></div>
    </div>
    <button class="resume" id="dResume" hidden>Riprendi da dove eri ↓</button>
  </article>

  <div class="sheet" id="nightSheet" role="dialog" aria-modal="true" aria-labelledby="nTitle" hidden>
    <div class="sheet__card">
      <h2 class="sheet__title" id="nTitle">Filtro luce blu</h2>
      <p class="sheet__text">Scalda i colori dello schermo e toglie la luce blu, per leggere di sera con una luce più morbida.</p>
      <div class="seg" role="radiogroup" aria-label="Quando accenderlo" id="nMode">
        <button role="radio" data-v="auto">Al tramonto</button>
        <button role="radio" data-v="on">Sempre</button>
        <button role="radio" data-v="off">Spento</button>
      </div>
      <p class="sheet__note" id="nNote"></p>
      <p class="sheet__label">Intensità</p>
      <div class="seg" role="radiogroup" aria-label="Intensità" id="nLevel">
        <button role="radio" data-v="1">Leggero</button>
        <button role="radio" data-v="2">Medio</button>
        <button role="radio" data-v="3">Forte</button>
      </div>
      <button class="sheet__link" id="nGeo">Usa la mia posizione per orari più precisi</button>
      <button class="sheet__done" id="nDone">Fatto</button>
    </div>
  </div>
  <div class="night" id="night" aria-hidden="true"></div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script src="assets/js/app.js" type="module"></script>
</body>
</html>
