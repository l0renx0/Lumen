<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Lumen · Una cosa vera al giorno</title>
  <meta name="description" content="Un feed personale di conoscenze verificate, da fonti scientifiche e istituzionali affidabili.">
  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0b0b0c" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Lumen">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="assets/icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/app.css">
  <script>
    // Applica il tema prima del primo disegno, per evitare lampi bianchi.
    try { const t = localStorage.getItem('lumen.theme'); if (t) document.documentElement.dataset.theme = t; } catch (e) {}
  </script>
</head>
<body>
  <a class="skip" href="#feed">Vai alle schede</a>

  <header class="top" id="top">
    <button class="fresh" id="fresh" hidden>
      <span class="fresh__dot" aria-hidden="true"></span>
      Nuove schede · <strong>Aggiorna</strong>
    </button>

    <div class="top__row">
      <div class="brand">
        <svg class="brand__mark" viewBox="0 0 32 32" aria-hidden="true"><circle cx="16" cy="16" r="6.5"/><path d="M16 2.5v5M16 24.5v5M2.5 16h5M24.5 16h5M6.4 6.4l3.5 3.5M22.1 22.1l3.5 3.5M6.4 25.6l3.5-3.5M22.1 9.9l3.5-3.5"/></svg>
        <div>
          <h1 class="brand__name">Lumen</h1>
          <p class="brand__date" id="today"></p>
        </div>
      </div>
      <div class="top__actions">
        <div class="daily" id="daily" title="Conoscenze di oggi">
          <svg viewBox="0 0 36 36" aria-hidden="true"><circle class="daily__track" cx="18" cy="18" r="15"/><circle class="daily__fill" id="dailyFill" cx="18" cy="18" r="15"/></svg>
          <span id="dailyCount">0</span>
        </div>
        <button class="icon-btn" id="themeBtn" aria-label="Cambia tema">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path class="i-sun" d="M12 4V2m0 20v-2m8-8h2M2 12h2m13.66-5.66 1.41-1.41M4.93 19.07l1.41-1.41m0-11.32L4.93 4.93m14.14 14.14-1.41-1.41M12 17a5 5 0 1 0 0-10 5 5 0 0 0 0 10Z"/><path class="i-moon" d="M20.5 14.5A8.5 8.5 0 0 1 9.5 3.5a8.5 8.5 0 1 0 11 11Z"/></svg>
        </button>
      </div>
    </div>

    <nav class="tabs" role="tablist" aria-label="Sezioni">
      <button role="tab" class="tabs__btn" data-section="sapevi" aria-selected="true">Lo sapevi?</button>
      <button role="tab" class="tabs__btn" data-section="novita" aria-selected="false">Ricerca recente</button>
      <span class="tabs__pill" aria-hidden="true"></span>
    </nav>

    <div class="chips" id="chips" role="toolbar" aria-label="Filtra per argomento"></div>
  </header>

  <main class="feed" id="feed" tabindex="-1" aria-live="polite"></main>

  <article class="detail" id="detail" aria-modal="true" role="dialog" aria-labelledby="dTitle" hidden>
    <div class="detail__scroll" id="detailScroll">
      <div class="detail__hero" id="dHero"></div>
      <button class="detail__close icon-btn" id="dClose" aria-label="Chiudi">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>
      </button>
      <div class="detail__body">
        <div class="meta-row" id="dMeta"></div>
        <h2 class="detail__title" id="dTitle"></h2>
        <p class="detail__lead" id="dLead"></p>
        <div class="solid" id="dSolid"></div>
        <div class="prose" id="dBody"></div>
        <section class="quotes" id="dQuotes"></section>
        <section class="sources">
          <h3 class="label">Fonti</h3>
          <ol id="dSources"></ol>
        </section>
        <p class="disclaimer" id="dCredit"></p>
        <p class="disclaimer">Testo riassunto con l'aiuto di un'intelligenza artificiale e verificato rispetto alla fonte. In caso di dubbio, fa fede sempre l'originale.</p>
      </div>
    </div>
  </article>

  <template id="cardTpl">
    <article class="card" tabindex="0">
      <div class="card__media"></div>
      <div class="card__content">
        <div class="meta-row"></div>
        <h2 class="card__title"></h2>
        <p class="card__summary"></p>
        <div class="card__foot">
          <span class="card__source"></span>
          <span class="card__more">Leggi <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14m-6-6 6 6-6 6"/></svg></span>
        </div>
      </div>
    </article>
  </template>

  <script src="assets/js/app.js" type="module"></script>
</body>
</html>
